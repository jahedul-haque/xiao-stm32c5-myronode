# Zephyr Project Configuration for Node 1: Servo Follower

# Logging & Printf Support
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Hardware Floating Point Unit
CONFIG_FPU=y

# Hardware Peripherals
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# CAN FD Interface (500k nominal, 2M data phase matching Node 2)
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y
CONFIG_CAN_DEFAULT_BITRATE=500000
CONFIG_CAN_DEFAULT_BITRATE_DATA=2000000

# Real-Time Scheduling & Stacks
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
