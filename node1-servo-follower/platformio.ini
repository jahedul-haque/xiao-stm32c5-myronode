; PlatformIO Project Configuration for Node 1: Servo Follower Actuator
; Seeed Studio XIAO STM32C5 (KineMirror System)

[env:seeed-xiao-stm32c5]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
framework = zephyr
board = seeed-xiao-stm32c5
monitor_speed = 115200

build_flags =
    -O2
    -Wall
    -Wextra
    -DCONFIG_CBPRINTF_FP_SUPPORT=1

; Flash mode: TinyUF2 bootloader (double-click reset button to mount XIAOC5BOOT drive)
upload_protocol = uf2
